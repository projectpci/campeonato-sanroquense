<body class="entrada-corpo">
  <main class="entrada">
    <span class="entrada__brilho" aria-hidden="true"></span>

      <h1 class="entrada__titulo">Campeonato <em>SRP</em></h1>

        <li><b>10</b> times</li><li><b>45</b> jogos</li><li><b>1</b> campeão</li>

    <a class="entrada__agora oculto" id="entrada-agora" href="inicio.html"></a>

    <section class="entrada__escolha" aria-labelledby="pergunta">

      <div class="entrada__opcoes">
        <a class="entrada__opcao" href="inicio.html" data-perfil="torcedor" data-modo="torcedor">
          <span class="entrada__icone" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4.5" r="2.2" fill="currentColor"/><path d="M4 3.5l3.5 5.5 4.5 1.8 4.5-1.8L20 3.5"/><path d="M12 10.8v4.4l-3.2 6.3M12 15.2l3.2 6.3"/></svg>
          </span>
          <strong>Torcedor</strong>
          <span class="entrada__seta" aria-hidden="true">→</span>
        </a>
        <a class="entrada__opcao" href="clube.html" data-perfil="clube" data-modo="clube">
          <span class="entrada__icone" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M8.5 3L3 6.2l2.2 4.3 2.8-1.2V21h8V9.3l2.8 1.2L21 6.2 15.5 3c-.6 1.6-1.9 2.6-3.5 2.6S9.1 4.6 8.5 3z"/><path d="M10.5 12.5h3" stroke-linecap="round"/></svg>

          <span class="entrada__seta" aria-hidden="true">→</span>

    <a class="entrada__adm" href="admin.html" data-modo="adm">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7.5a4 4 0 018 0V11"/></svg>
      Área do organizador

    <div class="entrada__escudos" aria-hidden="true"><div class="entrada__faixa" id="entrada-escudos"></div></div>

    <a class="entrada__instalar" href="instalar.html">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M8 11l4 4 4-4M5 20h14"/></svg>
